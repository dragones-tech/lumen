<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumen · docs</title>

  <!-- Tailwind Play CDN + Typography plugin (for the rendered markdown `prose`). No build. -->
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>

  <!-- highlight.js for syntax colors in the rendered code blocks. -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <!-- Import map: import from 'lumen' instead of relative paths. -->
  <script type="importmap">
    { "imports": { "lumen": "../src/index.js", "lumen/": "../src/" } }
  </script>

  <!-- modulepreload: fetch the whole module graph in parallel (HTTP/2 multiplexing),
       flattening the native-ESM import waterfall — a bundle's speed without a bundle. -->
  <link rel="modulepreload" href="../src/index.js" />
  <link rel="modulepreload" href="../src/event-emitter.js" />
  <link rel="modulepreload" href="../src/dom.js" />
  <link rel="modulepreload" href="../src/animate.js" />
  <link rel="modulepreload" href="../src/view.js" />
  <link rel="modulepreload" href="../src/model.js" />
  <link rel="modulepreload" href="../src/collection.js" />
  <link rel="modulepreload" href="../src/collection-view.js" />
  <link rel="modulepreload" href="../src/region.js" />
  <link rel="modulepreload" href="../src/router.js" />
  <link rel="modulepreload" href="../src/http.js" />
  <link rel="modulepreload" href="../src/i18n.js" />
  <link rel="modulepreload" href="../src/validate.js" />
  <link rel="modulepreload" href="../src/element.js" />
</head>
<body class="text-slate-800">
  <!-- ===== App shell (a View with regions) ===== -->
  <template id="shell">
    <div class="min-h-screen grid grid-cols-[15rem_1fr] grid-rows-[auto_1fr]">
      <header class="col-span-2 flex items-center gap-4 px-5 py-3 border-b border-slate-200 sticky top-0 bg-white/90 backdrop-blur z-10">
        <span class="font-extrabold text-lg tracking-tight">Lumen <small data-ref="tagline" class="text-slate-400 font-medium text-xs ml-1"></small></span>
        <span class="flex-1"></span>
        <button data-ref="lang" class="text-sm px-3 py-1 border border-slate-200 rounded-md hover:bg-slate-50">ES</button>
      </header>
      <aside data-ref="sidebar" class="border-r border-slate-200 p-3 sticky top-[3.25rem] self-start h-[calc(100vh-3.25rem)] overflow-auto"></aside>
      <main data-ref="content" class="p-8 w-full"></main>
    </div>
  </template>

  <template id="sidebar">
    <nav data-ref="nav" class="flex flex-col gap-1"></nav>
  </template>

  <template id="doc">
    <div data-ref="layout">
      <div data-ref="body" class="prose prose-slate max-w-none prose-code:before:content-none prose-code:after:content-none prose-pre:p-0 prose-pre:bg-[#0d1117]">Loading…</div>
      <div data-ref="exWrap" class="lg:sticky lg:top-[4.5rem]">
        <div data-ref="exLabel" class="text-xs uppercase tracking-wider text-slate-400 mb-2">Live example</div>
        <iframe data-ref="frame" title="example" class="w-full h-[26rem] lg:h-[calc(100vh-7rem)] border border-slate-200 rounded-xl bg-white"></iframe>
        <a data-ref="open" target="_blank" class="inline-block mt-2 text-sm text-blue-600 hover:underline">open in new tab ↗</a>
      </div>
    </div>
  </template>

  <template id="intro">
    <div>
      <!-- hero -->
      <section class="text-center py-8">
        <h1 class="text-5xl font-extrabold tracking-tight">Lumen</h1>
        <p data-ref="tagline" class="text-lg text-slate-500 mt-3 max-w-xl mx-auto"></p>
        <div data-ref="chips" class="flex flex-wrap gap-2 justify-center mt-5"></div>
      </section>

      <!-- complete example: running app + its source -->
      <section class="mt-2">
        <div data-ref="demoLabel" class="text-xs uppercase tracking-wider text-slate-400 mb-2">A complete app — running</div>
        <div class="grid lg:grid-cols-2 gap-5 items-start">
          <div data-ref="demo"></div>
          <pre class="rounded-xl bg-[#0d1117] overflow-auto text-[13px] leading-relaxed"><code class="language-js" data-ref="code"></code></pre>
        </div>
      </section>

      <div data-ref="body" class="prose prose-slate max-w-3xl mt-10 prose-code:before:content-none prose-code:after:content-none prose-pre:p-0 prose-pre:bg-[#0d1117]"></div>
    </div>
  </template>

  <!-- ===== landing demo: a complete TodoApp (Lumen + Tailwind) ===== -->
  <template id="demo-app">
    <div class="rounded-xl border border-slate-200 bg-white shadow-sm p-4">
      <form data-ref="form" class="flex gap-2">
        <input data-ref="input" class="flex-1 rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Add a todo…" autocomplete="off" />
        <button class="rounded-lg bg-blue-600 text-white px-3 py-2 text-sm hover:bg-blue-700">add</button>
      </form>
      <ul data-ref="list" class="mt-3 space-y-2"></ul>
      <div class="mt-3 text-xs text-slate-400"><span data-ref="count">0</span> left</div>
    </div>
  </template>

  <template id="demo-item">
    <li class="flex items-center gap-2 rounded-lg border border-slate-200 px-3 py-2 bg-white">
      <input type="checkbox" data-ref="check" class="size-4" />
      <span data-ref="text" class="flex-1 text-sm"></span>
      <button data-ref="remove" class="text-slate-400 hover:text-red-500 text-lg leading-none">&times;</button>
    </li>
  </template>

  <div id="app"></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
