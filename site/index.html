<!doctype html>
<html lang="en" data-mode="dark" data-theme="miasma">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumen · docs</title>

  <!-- highlight.js theme FIRST, so site.css (loaded after) can re-tint it to the miasma palette. -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />

  <!-- scc (Scoped Cascade CSS) + the miasma theme + the docs shell layout. No build. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/dragones-tech/scc@e43d78874e68/scc.css" />
  <link rel="stylesheet" href="../assets/miasma.css" />
  <link rel="stylesheet" href="./site.css?v=3" />

  <!-- highlight.js engine + extra languages (server templates used in the structure guide). -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/erb.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/django.min.js"></script>

  <!-- Import map: import from 'lumenjs' instead of relative paths. -->
  <script type="importmap">
    { "imports": { "lumenjs": "../src/index.js", "lumenjs/": "../src/" } }
  </script>

  <!-- modulepreload: fetch the whole module graph in parallel (HTTP/2 multiplexing),
       flattening the native-ESM import waterfall — a bundle's speed without a bundle. -->
  <link rel="modulepreload" href="../src/index.js" />
  <link rel="modulepreload" href="../src/event-emitter.js" />
  <link rel="modulepreload" href="../src/dom.js" />
  <link rel="modulepreload" href="../src/animate.js" />
  <link rel="modulepreload" href="../src/view.js" />
  <link rel="modulepreload" href="../src/model.js" />
  <link rel="modulepreload" href="../src/collection.js" />
  <link rel="modulepreload" href="../src/collection-view.js" />
  <link rel="modulepreload" href="../src/region.js" />
  <link rel="modulepreload" href="../src/router.js" />
  <link rel="modulepreload" href="../src/http.js" />
  <link rel="modulepreload" href="../src/i18n.js" />
  <link rel="modulepreload" href="../src/validate.js" />
  <link rel="modulepreload" href="../src/element.js" />
</head>
<body>
  <!-- ===== App shell (a View with regions) ===== -->
  <template id="shell">
    <div class="shell">
      <header class="shell-header">
        <button data-ref="menu" class="menu-btn" aria-label="Toggle menu">
          <svg style="pointer-events:none" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <span class="shell-title">Lumen <small data-ref="tagline"></small></span>
        <span class="shell-spacer"></span>
        <a href="https://github.com/dragones-tech/lumen" target="_blank" rel="noopener"
           title="View on GitHub" aria-label="View on GitHub" class="icon-link">
          <svg viewBox="0 0 16 16" width="22" height="22" fill="currentColor" aria-hidden="true">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
          </svg>
        </a>
        <button data-ref="lang" data-variant="ghost">ES</button>
      </header>
      <div data-ref="backdrop" class="shell-backdrop"></div>
      <aside data-ref="sidebar" class="shell-sidebar"></aside>
      <main data-ref="content" class="shell-main"></main>
    </div>
  </template>

  <template id="sidebar">
    <nav data-ref="nav" class="nav"></nav>
  </template>

  <template id="doc">
    <div data-ref="layout" class="doc-layout">
      <div data-ref="body" class="doc-body">Loading…</div>
      <div data-ref="exWrap" class="ex-wrap">
        <div data-ref="exLabel" class="ex-label">Live example</div>
        <div data-ref="exFrames" class="ex-frames"></div>
      </div>
    </div>
  </template>

  <template id="intro">
    <div>
      <section class="hero">
        <h1>Lumen</h1>
        <p data-ref="tagline"></p>
        <div data-ref="chips" class="chips"></div>
      </section>

      <!-- complete example: running app + its source -->
      <section>
        <div data-ref="demoLabel" class="ex-label">A complete app — running</div>
        <div class="demo-grid">
          <div data-ref="demo"></div>
          <pre class="code-block"><code class="language-js" data-ref="code"></code></pre>
        </div>
      </section>

      <div data-ref="body" class="doc-body" style="max-width: var(--measure); margin-top: 2.5rem"></div>
    </div>
  </template>

  <!-- ===== landing demo: a complete TodoApp (Lumen + scc) ===== -->
  <template id="demo-app">
    <article class="card">
      <form data-ref="form" class="cluster"><input data-ref="input" placeholder="Add a todo…" autocomplete="off" /><button data-variant="primary">add</button></form>
      <ul data-ref="list" class="stack"></ul>
      <p><span class="badge" data-ref="count">0</span> left</p>
    </article>
  </template>

  <template id="demo-item">
    <li class="cluster" style="justify-content: space-between">
      <label class="cluster"><input type="checkbox" data-ref="check" /> <span data-ref="text"></span></label>
      <button data-variant="ghost" data-ref="remove">&times;</button>
    </li>
  </template>

  <div id="app"></div>
  <!-- ?v bumped on each main.js change → forces a fresh fetch past the CDN/browser cache. -->
  <script type="module" src="./main.js?v=5"></script>
</body>
</html>
